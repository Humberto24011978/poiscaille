name: Conditions du jour

# Chaque matin : météo, débits, conditions du jour et prévisions, publication du site.
on:
  schedule:
    # Heures UTC : environ 5 h 20, 6 h 50, 8 h 15 et 10 h 45 à Paris en hiver
    - cron: "23 4 * * *"
    - cron: "53 5 * * *"
    - cron: "19 7 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Préparation des données"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/index.html", "scripts/04_jour.py", "scripts/commun.py", "requirements.txt"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  controle:
    runs-on: ubuntu-latest
    outputs:
      faire: ${{ steps.verif.outputs.faire }}
    steps:
      - id: verif
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Les déclenchements programmés de GitHub peuvent être en retard ou sautés : on en prévoit plusieurs
          # dans la matinée, et chacun s'arrête si la mise à jour du jour (heure de Paris) a déjà réussi.
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "faire=oui" >> "$GITHUB_OUTPUT"; exit 0; fi
          debut=$(date -u -d "TZ=\"Europe/Paris\" $(TZ=Europe/Paris date +%F) 00:00" +%FT%TZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/quotidien.yml/runs?status=success&per_page=30" \
                --jq "[.workflow_runs[] | select(.created_at >= \"$debut\")] | length")
          if [ "${n:-0}" -gt 0 ]; then echo "Mise à jour déjà faite aujourd'hui."; echo "faire=non" >> "$GITHUB_OUTPUT";
          else echo "faire=oui" >> "$GITHUB_OUTPUT"; fi

  jour:
    needs: controle
    if: needs.controle.outputs.faire == 'oui' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Conditions du jour et prévisions
        run: |
          if [ -f data/eaux.gpkg ] && [ -f data/potentiel.csv ]; then python scripts/04_jour.py; else echo "Pas encore de données : lancez la préparation."; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
